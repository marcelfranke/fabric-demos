[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hubdemo"
version = "0.1.0"
description = "Hub recovery demo: scenario rules, Fabric and Foundry build for the QR004 night bank"
readme = "README.md"
# Python 3.11 is the runtime of Fabric user data functions, so the whole kit stays on it.
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # Phase 4: deploy item definitions and upload reference data to OneLake.
    "fabric-cicd>=0.1",
    "azure-identity>=1.17",
    "azure-storage-file-datalake>=12.14",
    "requests>=2.31",
    # Phase 5: send events to the custom endpoint of the eventstream.
    "azure-eventhub>=5.15",
    # The async DefaultAzureCredential builds an async pipeline, and that pipeline
    # needs an async http transport. Without aiohttp it raises at construction time.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
hubdemo = "hubdemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs cloud resources, skipped unless HUBDEMO_LIVE=1",
    "security: security behaviour test, skipped unless HUBDEMO_LIVE=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
exclude = [".venv", "data", "fabric/workspace", "fabric/workspace-sync"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
