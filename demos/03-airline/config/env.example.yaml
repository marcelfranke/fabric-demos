# Template environment file. Copy it to config/env.<name>.yaml and fill in every
# value, then run `python scripts/check_prereqs.py --env <name>` to confirm.
#
# No secrets go in here. These are names and identifiers only. Azure access comes
# from DefaultAzureCredential after `az login` (rule 6).
# Filled-in copies are ignored by git; only this template is committed.

# Azure tenant that holds the subscription, the Fabric capacity and the people.
tenant_id:
# Subscription that holds the resource group below.
subscription_id:
# Azure region for the resource group and the Foundry resource.
# See docs/verify-list.md V1: Fabric workload availability differs by region.
location:
# One resource group holds everything this demo creates in Azure.
resource_group:

fabric:
  # Paid Fabric capacity, F2 or larger. Trial capacities are not supported by the
  # operations agent, see docs/verify-list.md V2.
  capacity_name:
  # Fabric workspace that holds the lakehouse, eventhouse, SQL database, ontology,
  # data agent, pipelines and functions.
  workspace_name:

foundry:
  # Azure AI Foundry resource name.
  resource_name:
  # Project inside that resource. The planner agent lives here.
  project_name:
  # Name of the model deployment the planner agent uses.
  model_deployment:
  # Price per million input tokens for that deployment, in the currency you quote.
  # A parameter, never hard-coded: prices and availability change (V18).
  price_in_per_million:
  # Price per million output tokens for that deployment.
  price_out_per_million:

people:
  # Duty manager. Approves the recovery plan in run A.
  duty_manager_upn:
  # Operations control manager. Second stage of the run B approval policy.
  ops_control_manager_upn:
  # Gate agent. Asks the read-only questions in the Copilot moment.
  gate_agent_upn:
  # Whoever builds and demonstrates the kit. Owns the Fabric items.
  builder_upn:

teams:
  # Team that receives the alert and the approval cards.
  team_id:
  # Channel inside that team.
  channel_id:

sentinel:
  # Log Analytics workspace with Microsoft Sentinel enabled. Receives security_events.
  workspace_name:

purview:
  # Sensitivity label applied to the demo data, used in the Purview moment.
  label_name:

eventstream:
  # Event hub namespace of the custom endpoint on the eventstream es_flight_events.
  # Copied by hand from the Fabric portal: no REST API returns it (V69).
  namespace:
  # Event hub name shown next to that namespace on the same portal page.
  event_hub:
