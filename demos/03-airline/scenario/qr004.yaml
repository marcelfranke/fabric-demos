# Scenario: one late inbound flight at the Doha hub.
# Everything in this file is invented. Flight numbers, times, counts, members and rules are placeholders.
# The generator, the rules engine and every test take their numbers from here. Do not hard-code them elsewhere.

scenario_id: qr004-night-bank
airline_code: QR
hub: DOH
timezone: Asia/Qatar
loyalty_programme: Privilege Club
sim_now_local: "2026-11-14T23:10:00"        # the moment the delay becomes known

inbound:
  id: QR004
  flight_no: "QR 004"
  origin: LHR
  origin_city: London Heathrow
  sched_arrival_local: "2026-11-15T00:35:00"
  new_eta_local: "2026-11-15T01:30:00"
  departure_delay_min: 58
  arrival_delay_min: 55
  gate: C31
  pax_onboard: 268
  pax_connecting: 164                        # 268 - 164 = 104 passengers end their journey in Doha

# Transfer rules. Placeholders: the airline sets its own.
rules:
  pax_standard_min: 45          # minimum connection time, standard transfer
  pax_fasttrack_min: 30         # with escort and fast-track
  bag_standard_min: 40
  bag_priority_min: 25          # tail-to-tail transfer
  cargo_min: 35
  margin_min: 5                 # an option only counts as working with this much time to spare
  max_hold_min: 10              # the longest hold the agent may propose

# Tier benefits used in the demo. Source: public Privilege Club tier page, read 5 October 2026.
tiers:
  Platinum: {lounge_access: true,  priority_standby: true,  meet_assist: true}
  Gold:     {lounge_access: true,  priority_standby: true,  meet_assist: true}
  Silver:   {lounge_access: true,  priority_standby: true,  meet_assist: false}
  Burgundy: {lounge_access: false, priority_standby: false, meet_assist: false}

# Onward flights that carry passengers from the inbound flight.
# connecting_pax, bags and members count only people and bags arriving on the inbound flight.
onward_flights:
  - {id: MCT, flight_no: "QR 1126", dest: MCT, city: Muscat,       std_local: "2026-11-15T01:50:00", gate: A3,  other_pax_onboard: 148, connecting_pax: 5,  bags: 6,
     members: {Platinum: 1, Gold: 0, Silver: 1, Burgundy: 1},
